name: Connector proposal
description: Propose a new source or destination connector
labels: [connector]
body:
  - type: input
    id: product
    attributes:
      label: Product and direction
      placeholder: 'Source: Trello · or · Destination: Asana'
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Official API
      description: Link the documentation. Auth method, rate limits, pagination, what can and cannot be read/written, and anything the API cannot create.
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: Honest support matrix
      description: What would be supported / transformed / lossy / unsupported? A plan that hides losses is worse than none.
  - type: textarea
    id: reliability
    attributes:
      label: Idempotency and verification
      description: For a destination — how do we avoid duplicates after a lost reply, and how do we verify?
  - type: checkboxes
    id: commit
    attributes:
      label: Contribution
      options:
        - label: I am willing to build it using docs/connector-sdk.md and the conformance kit
