name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: macos-latest, node: '22' }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version is taken from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Offline demo smoke test (no network is needed)
        run: node apps/cli/dist/bin.js demo --no-color > demo-output.txt && grep -q "175 verified" demo-output.txt && grep -q "OFFLINE DEMO" demo-output.txt

      - name: Secret scan (tracked files)
        run: node scripts/check-secrets.mjs

      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: pnpm audit --audit-level high

      - name: License allow-list (production dependencies)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: pnpm check:licenses

      - name: Test coverage (with a floor)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: pnpm test:coverage

      - name: Software bill of materials (CycloneDX)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: pnpm sbom:generate

      - name: Upload SBOM and coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-coverage
          path: |
            sbom/
            coverage/lcov.info
            coverage/coverage-summary.json
          retention-days: 30

  dashboard:
    name: Dashboard browser test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The static online demo, so its browser tests (e2e/static-demo.spec.ts) run in CI too.
      - run: pnpm build:demo
      # Skipped in the main job because the recorded data does not exist before `build:demo`; run it here.
      - name: Replay unit test against the freshly recorded demo data
        run: pnpm exec vitest run apps/web/test/replay.test.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
